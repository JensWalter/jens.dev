{{ if and .Site.Params.intro .IsHome }}
    <header class="post-header">
        {{- with .Site.Params.headline }}
        <h1 class="post-title" itemprop="name">{{ . }}</h1>
        {{- end }}
        {{- with .Site.Params.description }}
        <p>{{ . }}</p>
        {{- end }}
    </header>
{{ end }}
