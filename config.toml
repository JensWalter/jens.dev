baseurl = "https://jens.dev/"
title = "jens.dev"
theme = "ghostwriter"
uglyurls = true

[pagination]
  pagerSize = 999

[taxonomies]
tag = "tags"

[services]
  [services.rss]
    limit = 20
    
[Params]
  mainSections = ["post"]
  intro = true
  headline = ""
  description = "Things I built, broke, or figured out the hard way. Lately: Rust, self-hosting and local LLMs."
  github = "https://github.com/JensWalter"
  mastodon = "https://hachyderm.io/@jenswalter"
  opengraph = true
  rss = true

[Permalinks]
  post = "/:year/:month/:day/:contentbasename"

[markup]
  defaultMarkdownHandler = 'goldmark'
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "monokailight"

[menu]
main = [ 
{ name= "Blog",url= "/", weight= 1},
{ name= "Projects", url= "/project/", weight= 2}
]
