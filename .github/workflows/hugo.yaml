name: build and deploy
on:
  push:
    branches: ["main","hugo"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
      - name: build website
        run: hugo
      - name: Login to xj4dyqut.cr.dtz.dev
        uses: docker/login-action@v3
        with:
          registry: xj4dyqut.cr.dtz.dev
          username: apikey
          password: ${{ secrets.DTZ_API_KEY }}
      - name: build
        run: |
          docker build -t xj4dyqut.cr.dtz.dev/website .
      - name: uploading image
        run: |
          docker push xj4dyqut.cr.dtz.dev/website
      - name: Resolve image digest
        id: resolve_digest
        run: |
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' xj4dyqut.cr.dtz.dev/website:latest)
          echo "IMAGE_URL=$DIGEST" >> $GITHUB_ENV
      - name: Deploy latest image to service
        uses: DownToZero-Cloud/containers-service-update@main
        with:
          container_image: ${{ env.IMAGE_URL }}
          api_key: ${{ secrets.DTZ_API_KEY }}
          service_id: service-pfrlnjz6
      - name: Publish image URL to summary
        run: |
          echo "## Deployed image" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${IMAGE_URL}" >> $GITHUB_STEP_SUMMARY