title    = "My personal blog"
base_url = "https://jens.dev"
sitemap  = true
# local build-output leftovers; never rendered
ignore_dirs = ["public"]

[nav]
links = [
  { label = "Blog",     url = "/" },
  { label = "Projects", url = "/project/" },
]

[markdown]
syntax_highlighting = true
highlight_style     = "InspiredGitHub"
unsafe_html         = true

# ---------------------------------------------------------------------------
# Legacy Hugo URLs. Post/project/section-index `.html` URLs are handled by
# the built-in ugly-URL fallback; only URLs with no markdown source behind
# them need explicit entries: the old /post listing and the tag pages.
# ---------------------------------------------------------------------------

[[redirect]]
from = "/post/index.html"
to   = "/"
[[redirect]]
from = "/post/"
to   = "/"
[[redirect]]
from = "/post"
to   = "/"
